appId: com.example.monsterdeleter
productName: MonsterDeleter
directories:
  output: dist
files:
  - src/**/*
  - assets/**
  - build/find-file-rect.exe
  - package.json
asarUnpack:          # assets 保持真实文件,渲染进程 file:// 直接读;定位工具需被主进程直接执行
  - assets/**
  - build/find-file-rect.exe
win:
  target: nsis        # 安装版:启动快(免每次解压),卸载自动清注册表
  icon: public/logo.png   # 1024x1024 PNG,electron-builder 自动转 .ico
  artifactName: MonsterDeleter-Setup.exe
nsis:
  oneClick: false                    # 向导式安装(可改安装目录)
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true        # 桌面快捷方式
  createStartMenuShortcut: true
  shortcutName: 召唤怪兽摧毁文件
  uninstallDisplayName: 召唤怪兽摧毁文件
  include: build/installer.nsh       # 卸载时清理右键菜单注册表
